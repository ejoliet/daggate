[project]
name = "daggate"
version = "1.0.0"
description = "Production readiness gate for Apache Airflow DAGs (static, zero-dependency)"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[project.scripts]
daggate = "daggate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["daggate"]
