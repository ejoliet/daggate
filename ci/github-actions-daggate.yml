# Copy to .github/workflows/daggate.yml
name: daggate
on:
  pull_request:
    paths: ["dags/**"]
  push:
    branches: [main]
    paths: ["dags/**"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DAG production gate
        run: python daggate.py dags/ --format github
